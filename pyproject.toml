[project]
name = "product-knowledge-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.13,<2", "pymupdf>=1.24,<2", "sentence-transformers>=3,<6", "anthropic>=0.40,<1", "httpx>=0.27,<1", "jinja2>=3.1,<4", "langfuse>=3,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.7,<1"]
[tool.pytest.ini_options]
testpaths=["tests"]
[tool.ruff]
line-length=100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
