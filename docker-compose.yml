services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: product_rag
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d product_rag"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
