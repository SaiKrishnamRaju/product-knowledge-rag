name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://app:app@127.0.0.1:5432/product_rag_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: product_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d product_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[dev]'
      - run: ruff check app scripts tests
      - run: pytest -q
      - run: docker build -t product-knowledge-rag .
